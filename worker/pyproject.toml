[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cq_worker"
version = "0.2.0"
description = "Subprocess synthesis & beat studio worker for MusicScript"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "jedi>=0.18",
]

[project.scripts]
cq-worker = "cq_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cq_worker*"]
